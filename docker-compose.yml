version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nri_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nri_user
      POSTGRES_PASSWORD: nri_pass
      POSTGRES_DB: nri_concierge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nri_user -d nri_concierge']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nri_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nri_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nri_user:nri_pass@postgres:5432/nri_concierge
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'

volumes:
  postgres_data:
  redis_data:
